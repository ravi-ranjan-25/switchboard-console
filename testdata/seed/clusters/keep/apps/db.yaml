# CNPG cluster `db` (namespace configs, Service db-rw.configs). Disaster recovery: change `path`
# to ./apps/db/overlays/recovery (apps/db/README.md).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: db
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: false
  sourceRef: {kind: GitRepository, name: flux-system}
  path: ./apps/db
  dependsOn:
    - name: infra-configs
    - name: db-vars
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
      - kind: Secret
        name: db-backup-vars
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: db
      namespace: configs
