apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: feedback
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: false # replicas-0 or not-yet-built images must not hold up the rest
  sourceRef: {kind: GitRepository, name: flux-system}
  path: ./apps/feedback
  # No targetNamespace: db-client and the backup components emit objects into other namespaces.
  dependsOn:
    - name: infra-configs
  components:
    - ../../components/expose-google # <- the line Switchboard edits
    - ../../components/app-netpol
    - ../../components/backup-pvc
    - ../../infrastructure/configs/backup/pvc-backup
    - ../../infrastructure/configs/backup/restore-if-empty
  postBuild:
    substitute:
      APP: feedback
      NAMESPACE: personal
      PORT: "8000"
      HOST: play.example.com
      PVC: feedback-data
      DATA_VOLUME: data
      BACKUP_UID: "10001"
