apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: clientapp
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: false # replicas-0 or not-yet-built images must not hold up the rest
  sourceRef: {kind: GitRepository, name: flux-system}
  path: ./apps/clientapp
  # NetworkPolicy ships in apps/clientapp (Service port 80 != pod port 8080), so no app-netpol component.
  # No targetNamespace: db-client and the backup components emit objects into other namespaces.
  dependsOn:
    - name: infra-configs
  components:
    - ../../components/expose-public # <- the line Switchboard edits
  postBuild:
    substitute:
      APP: clientapp
      NAMESPACE: client
      PORT: "80"
      HOST: client.example.org
