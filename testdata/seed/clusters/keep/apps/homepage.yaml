apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homepage
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: false # replicas-0 or not-yet-built images must not hold up the rest
  sourceRef: {kind: GitRepository, name: flux-system}
  path: ./apps/homepage
  # No targetNamespace: db-client and the backup components emit objects into other namespaces.
  dependsOn:
    - name: infra-configs
  components:
    - ../../components/expose-private # <- the line Switchboard edits
    - ../../components/app-netpol
  postBuild:
    substitute:
      APP: homepage
      NAMESPACE: personal
      PORT: "3000"
      HOST: home.example.com
