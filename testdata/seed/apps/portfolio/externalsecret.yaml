# Synthetic fixture: every secret key is named explicitly because the secret store cannot list secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portfolio
  namespace: personal
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: portfolio
    creationPolicy: Owner
  data:
    - secretKey: AUTH_SECRET
      remoteRef:
        key: app-portfolio--auth-secret
    - secretKey: DASHBOARD_OWNER_EMAIL
      remoteRef:
        key: app-portfolio--dashboard-owner-email
    # Flagged needs_review at import: it points at the old database. Check before relying on it.
    - secretKey: DATABASE_URL
      remoteRef:
        key: app-portfolio--database-url
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: app-portfolio--google-client-id
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: app-portfolio--google-client-secret
    - secretKey: GROQ_API_KEY
      remoteRef:
        key: app-portfolio--groq-api-key
    - secretKey: KEYSTATIC_GITHUB_CLIENT_ID
      remoteRef:
        key: app-portfolio--keystatic-github-client-id
    - secretKey: KEYSTATIC_GITHUB_CLIENT_SECRET
      remoteRef:
        key: app-portfolio--keystatic-github-client-secret
    - secretKey: KEYSTATIC_SECRET
      remoteRef:
        key: app-portfolio--keystatic-secret
    - secretKey: TOKEN_ENCRYPTION_KEY
      remoteRef:
        key: app-portfolio--token-encryption-key
