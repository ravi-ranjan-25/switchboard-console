apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-n8n
  namespace: configs
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: example-vault}
  target:
    name: db-n8n
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: n8n
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: keep--n8n-db-password
