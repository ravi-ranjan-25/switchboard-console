apiVersion: apps/v1
kind: Deployment
metadata:
  name: clientapp
  namespace: client
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      citadel.dev/app: clientapp
  template:
    metadata:
      labels:
        citadel.dev/app: clientapp
        app.kubernetes.io/name: clientapp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clientapp
          image: registry.example.com/clientapp:20260101000000-0000000 # {"$imagepolicy": "flux-system:clientapp:tag"}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
