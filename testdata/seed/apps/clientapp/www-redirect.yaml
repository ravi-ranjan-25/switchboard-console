# www.client.example.org -> apex. The tunnel already sends the www host to Traefik; a separate Ingress
# plus a redirectregex Middleware keeps the apex Ingress (owned by the expose-* component) untouched.
# $${1} is Flux's escape for a literal ${1} (Flux would otherwise try to substitute it).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: www-redirect
  namespace: client
  labels:
    citadel.dev/app: clientapp
spec:
  redirectRegex:
    regex: ^https?://www\.clientappglobal\.com/(.*)
    replacement: https://client.example.org/$${1}
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clientapp-www
  namespace: client
  labels:
    citadel.dev/app: clientapp
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,private
    traefik.ingress.kubernetes.io/router.middlewares: client-www-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: www.client.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: clientapp
                port:
                  number: 80
