apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: planka
  namespace: personal
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: planka
    creationPolicy: Owner
    template:
      data:
        SECRET_KEY: "{{ .secretkey }}"
        # urlquery: the generated password may contain characters that are special in a URL.
        DATABASE_URL: "postgresql://planka:{{ .dbpass | urlquery }}@db-rw.configs:5432/planka"
  data:
    - secretKey: secretkey
      remoteRef:
        key: keep--planka-secret-key
    - secretKey: dbpass
      remoteRef:
        key: keep--planka-db-password
