server {
  listen [[.Port]];
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = [[.Health]] {
    default_type text/plain;
    return 200 "ok\n";
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
